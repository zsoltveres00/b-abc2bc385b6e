<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<!-- Enelkul a telefon 980 pixel szelesnek hiszi az oldalt es minden apro lesz. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BibleTravel - Utazas a Bibliaban. Fedezd fel a Bibliat, eld at a kalandot!">
<!-- Csak az kapja meg, akinek odaadjuk a linket: keresokbol kizarva. -->
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#5B3FD1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161327" media="(prefers-color-scheme: dark)">
<!-- "Hozzaadas a kezdokepernyohoz" utan sajat ablakban, cimsor nelkul indul. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BibleTravel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="img/app-icon.png">
<link rel="icon" href="img/app-icon.png">
<title>BibleTravel – Utazás a Bibliában</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&display=swap">
</head>
<body>
<style>
:root{
  --bg:#F3F1FF;--surface:#FFFFFF;--text:#1E1B3A;--muted:#6B6690;--brand:#5B3FD1;--brand2:#9B4DE0;--brand-ink:#FFFFFF;
  --gold:#F2A900;--star:#FFD23F;--correct:#22A559;--wrong:#E5484D;--ice:#D6ECFF;--ice-ink:#2F79C9;
  --wood:#9A5B2C;--lid:#B8712F;
  --walked:#3DD66A;--border:rgba(30,27,58,.12);--shadow:rgba(60,40,140,.14);--page:#E6E1FA;--pop:#EAF4FF;--pop-edge:#A8CDF0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161327;--surface:#241F3B;--text:#F4F1FF;--muted:#A7A1C6;--brand:#A78BFA;--brand2:#E08BF7;--brand-ink:#161327;
  --gold:#FFC83D;--correct:#4ADE80;--wrong:#F87171;--ice:#243A5C;--ice-ink:#8FC4FF;
  --walked:#34C759;--border:rgba(244,241,255,.14);--shadow:rgba(0,0,0,.45);--page:#0E0C1A;--pop:#1E2C44;--pop-edge:#3C5A80;
}}
:root[data-theme="dark"]{
  --bg:#161327;--surface:#241F3B;--text:#F4F1FF;--muted:#A7A1C6;--brand:#A78BFA;--brand2:#E08BF7;--brand-ink:#161327;
  --gold:#FFC83D;--correct:#4ADE80;--wrong:#F87171;--ice:#243A5C;--ice-ink:#8FC4FF;
  --walked:#34C759;--border:rgba(244,241,255,.14);--shadow:rgba(0,0,0,.45);--page:#0E0C1A;--pop:#1E2C44;--pop-edge:#3C5A80;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:Spectral,"New York",Georgia,serif}
/* Betoltes: amig a tartalom megjon, ez latszik a lap kozepen. */
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--page);padding:24px;text-align:center}
#boot p{margin:0;font-size:14px;line-height:1.5;color:var(--muted);max-width:320px}
#boot small{font-size:12px}
.bspin{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand);animation:bspin .8s linear infinite}
@keyframes bspin{to{transform:rotate(360deg)}}

#app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:460px){#app{box-shadow:0 0 0 1px var(--border),0 24px 60px -20px rgba(0,0,0,.5)}}
#view{flex:1;overflow:auto;overflow-x:hidden;padding:14px 18px 24px;-webkit-overflow-scrolling:touch}
#foot{flex:none}
#foot:empty{display:none}

/* header */
h1.brand{font-family:Spectral,Georgia,serif;font-size:28px;margin:0;font-weight:700}
.sub{font-size:15px;color:var(--muted);margin:2px 0 0}
.lvl{font-size:13px;font-weight:600;color:var(--gold);margin-top:4px}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 12px var(--shadow);display:flex;gap:10px;align-items:flex-start}
.hero .hl{flex:1;min-width:0}
.hero .sub{color:#fff;opacity:.9;font-size:13px;line-height:1.3}
.hero .lvl{display:inline-flex;align-items:center;gap:5px;color:#fff;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;margin-top:8px;font-size:12px;white-space:nowrap}
.hero .lvl svg{width:13px;height:13px;fill:currentColor}
.hero .lvl b{opacity:.85;font-weight:600}
.mascot{width:50px;height:50px;flex:none}
.hero .mw{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:112px}
.bubble{position:relative;background:#fff;color:var(--text);font-size:11px;font-weight:600;line-height:1.25;border-radius:10px;padding:6px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
:root[data-theme="dark"] .bubble,:root[data-theme="dark"] .bubble::after{background:var(--surface)}
/* Streak / hearts / talents: sticks to the top and scrolls down together with the module bar.
   The background fades out downwards so no hard white stripe cuts across the path. */
.srow{display:flex;justify-content:space-around;align-items:center;margin:12px -18px 0;padding:6px 22px 16px;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;position:sticky;top:-14px;z-index:4;background:linear-gradient(var(--bg) 0%,var(--bg) 62%,transparent 100%)}
.srow .st{display:flex;align-items:center;gap:5px}
.srow .st svg{width:24px;height:24px;fill:currentColor}
.srow .st img.sic{width:32px;height:32px;object-fit:contain}
.bar button img.nic{width:30px;height:30px;object-fit:contain}
.bar button.on img.nic{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--brand) 60%,transparent))}
.node .dot img.simg{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.node .dot img.nic{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.node .dot img.nic.lk{width:22px;height:22px;opacity:.85;filter:none}
.card-bal img.tbig{width:48px;height:48px;object-fit:contain;flex:none}
.shop .ic img{width:56px;height:56px;object-fit:contain;display:block}
/* The review card of a finished station pops out of the station itself, not up from the bottom. */
.popcard{position:absolute;z-index:6;width:250px;max-width:calc(100% - 28px);background:var(--pop);border-color:var(--pop-edge);border:1.5px solid var(--border);border-radius:16px;box-shadow:0 12px 28px var(--shadow);padding:10px 14px 12px;text-align:center;animation:popin .18s cubic-bezier(.34,1.5,.64,1)}
.popcard.up{transform-origin:50% 100%}.popcard.down{transform-origin:50% 0}
@keyframes popin{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
.popcard .xclose{right:6px;top:6px;width:26px;height:26px}
.popcard .xclose svg{width:11px;height:11px}
.popcard small{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.popcard h3{font-family:Spectral,Georgia,serif;font-size:16px;margin:2px 18px 4px;line-height:1.2}
.popcard p{margin:0 0 8px;font-size:12px;line-height:1.35;color:var(--muted)}
.popcard .rstars img,.popcard .rstars svg{width:20px;height:20px}
.popcard .rxp{font-size:12px;font-weight:800;color:var(--gold);margin:2px 0 6px}
.popcard .primary{padding:10px;font-size:14px;border-radius:9px}
.popcard .rhint{margin:6px 0 0;font-size:10px;color:var(--muted);line-height:1.3}
.popcard .tip{position:absolute;left:50%;width:12px;height:12px;background:var(--pop);border:1.5px solid var(--pop-edge);transform:translateX(-50%) rotate(45deg)}
.popcard.down .tip{top:-7px;border-right:0;border-bottom:0}
.popcard.up .tip{bottom:-7px;border-left:0;border-top:0}
.rsheet.mini h3{font-size:18px;margin:2px 0 4px}
.rsheet.mini p{text-align:center;font-size:14px;line-height:1.45;color:var(--muted)}
.rsheet.mini .rstars img,.rsheet.mini .rstars svg{width:24px;height:24px}
.rsheet.mini .rxp{margin:8px 0 4px;font-size:14px}
.rsheet.mini .primary{padding:12px}
.rsheet{text-align:center;padding:2px 4px 8px}
.rsheet small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rsheet h3{font-family:Spectral,Georgia,serif;font-size:21px;margin:4px 0 6px}
.rsheet h4{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.rsheet p{margin:0;font-size:15px;line-height:1.5;text-align:left}
.rsheet .rstars img,.rsheet .rstars svg{width:30px;height:30px}
.rsheet .verse.small{margin-top:10px;padding:10px 12px}
.rsheet .verse.small p{font-size:15px;text-align:center}
.rsheet .rxp{margin:12px 0 6px;font-size:15px;font-weight:800;color:var(--gold)}
.rsheet .rhint{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}
.bsheet{text-align:center;padding:4px 0 8px}.bsheet .bimg img{width:140px;height:140px;object-fit:contain}.bsheet .bimg span{font-size:80px}.bsheet:not(.on) .bimg{filter:grayscale(1);opacity:.5}
/* Vegigvezetes: a kiemelt resz vilagos marad, korulotte minden elsotetul,
   es egy kis kartya beszel hozza - ugyanugy, mint az allomasok kis kartyaja. */
#tourLayer{position:absolute;inset:0;z-index:9}
#tourLayer .tdim{position:absolute;inset:0;background:rgba(12,9,30,.62)}
#tourLayer .thole{position:absolute;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(12,9,30,.62);outline:3px solid var(--gold);outline-offset:0;
  animation:tglow 1.6s ease-in-out infinite}
@keyframes tglow{0%,100%{outline-color:var(--gold)}50%{outline-color:color-mix(in srgb,var(--gold) 45%,transparent)}}
#tourLayer .tcard{position:absolute;width:262px;background:var(--pop);border:1.5px solid var(--pop-edge);
  border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.45);padding:12px 14px 14px;
  animation:popin .18s cubic-bezier(.34,1.5,.64,1)}
#tourLayer .tcard.mid{left:50%;top:50%;transform:translate(-50%,-50%)}
#tourLayer .trow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#tourLayer .trow .mascot,#tourLayer .trow img.mascot{width:48px;height:48px;flex:none}
#tourLayer .ttx{min-width:0}
#tourLayer .ttx small{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#tourLayer .ttx b{display:block;font-family:Spectral,Georgia,serif;font-size:17px;line-height:1.15;margin-top:1px}
#tourLayer p{margin:0 0 11px;font-size:13.5px;line-height:1.45}
#tourLayer .primary{padding:10px;font-size:14px;border-radius:9px}
#tourLayer .tskip{display:block;width:100%;text-align:center;margin-top:7px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:underline}
#tourLayer .tip{position:absolute;width:12px;height:12px;background:var(--pop);border:1.5px solid var(--pop-edge);transform:translateX(-50%) rotate(45deg)}
#tourLayer .tcard.down .tip{top:-7px;border-right:0;border-bottom:0}
#tourLayer .tcard.up .tip{bottom:-7px;border-left:0;border-top:0}
/* Ki jatszik most: az osveny tetejen, egy koppintassal valthato. */
.whobar{display:flex;align-items:center;gap:8px;width:100%;margin:10px 0 0;padding:9px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);font-size:14px}
.whobar svg{width:16px;height:16px;fill:var(--brand);flex:none}
.whobar svg:last-child{margin-left:auto;width:12px;height:12px;fill:var(--muted)}
.whobar b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whobar span{font-size:12px;font-weight:600;color:var(--muted);margin-left:auto}
.prow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.prow .pmain{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1.5px solid transparent;min-width:0}
.prow.on .pmain{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.prow .pmain .mascot{width:38px;height:38px;flex:none}
.prow .pnm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pmain i{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--brand);white-space:nowrap}
.prow .pdel{flex:none;width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.prow .pdel svg{width:16px;height:16px;fill:var(--wrong)}
/* Parositas: ket oszlop, bal oldalon valasztunk, jobb oldalon keressuk a parjat. */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.mcol{display:contents}
.mitem{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 10px;font-size:15px;font-weight:600;text-align:center;line-height:1.25;min-height:56px;height:100%;
  display:flex;align-items:center;justify-content:center;transition:transform .08s}
.mitem:not(:disabled):active{transform:scale(.97)}
.mitem.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.mitem.ok{border-color:var(--correct);background:color-mix(in srgb,var(--correct) 16%,var(--surface));opacity:.7}
.mitem.bad{border-color:var(--wrong);background:color-mix(in srgb,var(--wrong) 16%,var(--surface));animation:shake .4s}
.introtx{margin:10px 0 0;font-size:15px;line-height:1.5;color:var(--muted);text-align:left}
.lvlcard{margin:16px 0 0;padding:16px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),var(--surface));border:1.5px solid var(--brand);text-align:left}
.lvlcard small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvlcard b{display:block;font-family:Spectral,Georgia,serif;font-size:24px;color:var(--brand);margin:2px 0 6px}
.lvlcard p{margin:0;font-size:14px;line-height:1.5;text-align:left}
.lvlall{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.lvlrow{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--border);text-align:left;opacity:.6}
.lvlrow.on{opacity:1;border-color:var(--correct);background:color-mix(in srgb,var(--correct) 10%,var(--surface))}
.lvlrow{width:100%;transition:transform .08s}
.lvlrow:active{transform:scale(.985)}
.lvlrow b{font-size:14px}
.lvlrow b i{font-style:normal;font-size:11px;font-weight:700;color:var(--correct)}
.lvlrow span{font-size:12px;color:var(--muted);line-height:1.35}
.difrow{display:flex;gap:6px;margin:-4px 0 8px}
.difbtn{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;text-align:center}
.difbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.bsheet .bnew{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.bsheet h3{font-family:Spectral,Georgia,serif;font-size:22px;margin:8px 0 4px}.bsheet p{margin:0 auto;max-width:300px;font-size:15px;color:var(--muted);line-height:1.4}
.bsheet .bst{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--muted)}.bsheet.on .bst{color:var(--gold)}.bsheet .bst svg{width:16px;height:16px;fill:currentColor}
.badge{cursor:pointer}
.srow .st .coin{width:22px;height:22px}
.srow .st .n{color:var(--text)}
.srow .tm{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}
.hero .stg{font-size:10px;font-weight:700;color:#fff;opacity:.85}
/* artwork sizes (images replace emoji/SVG where available) */
img.mascot{object-fit:contain}
.marker .big img{width:50px;height:50px;object-fit:contain}
.banner span img{width:38px;height:38px;object-fit:contain;vertical-align:middle}
.mh .me img{width:48px;height:48px;object-fit:contain}
.gc .em img{width:72px;height:72px;object-fit:contain;display:block}
.hcard .em img{width:60px;height:60px;object-fit:contain;display:block}
.badge span img{width:44px;height:44px;object-fit:contain;display:block}
.mascot.young{transform:scale(.82)}
.mascot.big{transform:scale(1.12)}
.mascot.silver{filter:saturate(.25) brightness(1.15) drop-shadow(0 0 3px #C7C3DA)}
.mascot.glow{filter:drop-shadow(0 0 6px var(--star))}
.mascot.gold.glow{filter:sepia(.7) saturate(2.2) hue-rotate(-12deg) drop-shadow(0 0 7px var(--star))}
.mascot.crown{position:relative}
.mascot.gold{filter:sepia(.7) saturate(2.2) hue-rotate(-12deg) drop-shadow(0 0 5px var(--star))}
.mascot.sad{filter:saturate(.5) brightness(.95);transform:rotate(-10deg)}
.jump{position:absolute;right:14px;bottom:76px;width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px var(--shadow);z-index:7}
.jump svg{width:22px;height:22px;fill:#fff}
.goal{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:700}
.goal svg{width:16px;height:16px;fill:var(--brand);flex:none}
.goal img.gic{width:26px;height:26px;object-fit:contain;flex:none}
/* A cel maga egy sorban maradjon telefonon is; a jobb oldali megjegyzes torhet. */
.goal>span{white-space:nowrap;flex:none}
.goal.ok{border-color:var(--correct)}.goal.ok svg{fill:var(--correct)}
.goal b{margin-left:auto;font-size:10px;font-weight:600;color:var(--muted);text-align:right}
/* intro: story + memory verse */
.ititle{font-family:Spectral,Georgia,serif;font-size:24px;margin:0 0 12px}
.story{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.story h4,.verse h4{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.story p{margin:0;font-size:16px;line-height:1.55}
.story p+p,.story ul,.story .tblwrap{margin-top:10px}
.story strong{font-weight:700}
.story em{font-style:italic;color:var(--muted)}
.stul{margin:0;padding-left:20px}
.stul li{font-size:16px;line-height:1.5;margin:3px 0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stbl{border-collapse:collapse;width:100%;font-size:14px;line-height:1.35}
.stbl th,.stbl td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.stbl th{background:color-mix(in srgb,var(--brand) 10%,var(--surface));font-weight:700}
.hearts .tm{font-size:11px;font-weight:700;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.verse{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 18%,var(--surface)),var(--surface));border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px}
.verse p{margin:0;font-family:Spectral,Georgia,serif;font-size:17px;font-weight:600;line-height:1.45}
.verse span{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--gold)}
/* ordering question */
.opt.oitem{display:flex;align-items:center;gap:12px;text-align:left}
.oitem b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:13px;color:var(--brand-ink)}
.oitem.picked{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.oitem.picked b{background:var(--brand);border-color:var(--brand)}
.oitem.ok b{background:var(--correct);border-color:var(--correct)}.oitem.bad b{background:var(--wrong);border-color:var(--wrong)}
/* hero side-quests on the path */
.hero-node{position:absolute;top:-6px;width:84px;display:flex;flex-direction:column;align-items:center;gap:1px;-webkit-tap-highlight-color:transparent;z-index:2}
.hero-node.right{right:2px;left:auto}
.hero-node.left{left:2px;right:auto}
/* The three stars arch above the figure so they never cover it. */
.hstars{position:absolute;top:-22px;left:50%;width:0;height:0}
.hstars i{position:absolute;width:20px;height:20px;display:grid;place-items:center}
.hstars i img,.hstars i svg{width:18px;height:18px;opacity:.3;filter:grayscale(1)}
.hstars i.on img,.hstars i.on svg{opacity:1;filter:none}
.hstars i.s0{transform:translate(-34px,6px) rotate(-22deg)}
.hstars i.s1{transform:translate(-10px,-6px)}
.hstars i.s2{transform:translate(14px,6px) rotate(22deg)}
.hero-node .hf{position:relative;width:62px;height:62px;display:grid;place-items:center}
.hero-node .hf img{width:62px;height:62px;object-fit:contain;filter:grayscale(1) opacity(.45)}
.hero-node .hf img.mascot{transform:none}
.hero-node.open .hf img{filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
.hero-node.done .hf img{filter:drop-shadow(0 0 6px var(--star)) drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.hero-node .hf i{width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px dashed var(--brand);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:20px;color:var(--brand)}
.hero-node small{font-size:9px;font-weight:800;color:var(--muted);white-space:nowrap}
.hstars i.s0{transform:translate(-34px,4px) rotate(-20deg)}
.hstars i.s1{transform:translate(-9px,-8px)}
.hstars i.s2{transform:translate(16px,4px) rotate(20deg)}
.hero-node.locked{opacity:.75}.hero-node.locked .hf i{opacity:.5}
.ltag img.hmini{width:48px;height:48px;object-fit:contain}
.hres{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}.hres img{width:96px;height:96px;object-fit:contain}
.hres small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.hres b{font-family:Spectral,Georgia,serif;font-size:20px}
.hgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.hc{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.hc .em{padding-top:4px;line-height:1}.hc .em img{width:72px;height:72px;object-fit:contain;display:block;filter:grayscale(1);opacity:.45}.hc .em i{width:60px;height:60px;font-size:24px;border-radius:50%;background:var(--bg);border:2px dashed var(--brand);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--brand)}
.hc.gold .em img{filter:none;opacity:1}.hc.gold{border-color:var(--star);background:color-mix(in srgb,var(--star) 12%,var(--surface))}
.hc.silver .em img{filter:grayscale(.6);opacity:.8}
.hc.locked{opacity:.55}
.hc b{font-size:11px;font-weight:600;text-align:center;line-height:1.2;min-height:30px;display:flex;align-items:center}.hc .hs svg,.hc .hs img{width:16px;height:16px;fill:var(--star);color:var(--star)}.hc.locked .hs svg{fill:var(--muted)}.hc:not(.gold):not(.silver) .hs svg{fill:none;color:var(--muted)}
/* picture choice */
.opt.pimg{padding:8px}.opt.pimg img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
/* colouring task */
.cbox2{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cbox2 canvas.line{position:absolute;inset:0;width:100%;height:100%}
.cbox2 .found{position:absolute;background-repeat:no-repeat;animation:pop .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 0 2px var(--correct) inset;border-radius:6px}
.cbox2 .full{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:fadein .8s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.cbox2.shake{animation:shake .4s}
.cbox2.done{border-color:var(--correct);box-shadow:0 0 0 3px color-mix(in srgb,var(--correct) 30%,transparent)}
.snips{display:flex;justify-content:center;gap:14px;margin-top:12px}
.snip{position:relative;width:96px;height:96px;border-radius:14px;border:2px solid var(--brand);background-color:var(--surface);background-repeat:no-repeat;box-shadow:0 3px 8px var(--shadow)}

.snip.got{border-color:var(--correct);opacity:.45}.snip.got span{background:var(--correct)}
/* fill-in-the-blank */
.fill{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-family:Spectral,Georgia,serif;font-size:18px;font-weight:600;line-height:1.7}
.blank{display:inline-block;min-width:96px;padding:0 10px;border-bottom:3px solid var(--brand);text-align:center;color:var(--brand);font-family:inherit}

.fillans{margin-top:8px;font-size:14px;color:var(--muted)}.fillans b{color:var(--correct)}
/* After answering: the right answer in words, then the verse the question came from. */
.ansline{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--correct) 12%,var(--surface));border:1.5px solid color-mix(in srgb,var(--correct) 35%,var(--surface));font-size:15px;line-height:1.4}

.qverse{margin:12px 0 0;padding:14px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border)}

.chip.ok{border-color:var(--correct);background:color-mix(in srgb,var(--correct) 16%,var(--surface))}.chip.bad{border-color:var(--wrong);background:color-mix(in srgb,var(--wrong) 16%,var(--surface))}

/* path */
/* Minden resznek sajat halvany szine van; tiz szin utan ujrakezdodik a sor.
   A szin a hatterbe van keverve, ezert sotet modban is magatol illeszkedik. */
.pgroup{margin:0 -10px 6px;padding:4px 10px 12px;border-radius:18px;
  background:color-mix(in srgb,var(--psz,var(--bg)) 13%,var(--bg))}
:root[data-theme="dark"] .pgroup{background:color-mix(in srgb,var(--psz,var(--bg)) 17%,var(--bg))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pgroup{background:color-mix(in srgb,var(--psz,var(--bg)) 17%,var(--bg))}}
/* A savon belul a feliratok alatetje is a sav szinet vegye fel. */
.pgroup .node small,.pgroup .hero-node small{background:color-mix(in srgb,var(--psz,var(--bg)) 13%,var(--bg))}
:root[data-theme="dark"] .pgroup .node small,:root[data-theme="dark"] .pgroup .hero-node small{background:color-mix(in srgb,var(--psz,var(--bg)) 17%,var(--bg))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pgroup .node small,:root:not([data-theme="light"]) .pgroup .hero-node small{background:color-mix(in srgb,var(--psz,var(--bg)) 17%,var(--bg))}}
.path{position:relative}
.path .pblock{position:relative;background-size:100% auto;background-repeat:repeat-y;background-position:top center;border-radius:18px;overflow:hidden}
.path .pblock::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 58%,transparent);pointer-events:none;z-index:0}
.path .pblock>*{position:relative;z-index:1}
/* A tájon a feliratok és a figurák kapnak egy halvány alátétet. */
.path .pblock .phead{background:color-mix(in srgb,var(--bg) 78%,transparent);border-radius:10px;padding:4px 8px;margin-left:-4px;margin-right:-4px}
.path .pblock .hero-node small,.path .pblock .node small{background:color-mix(in srgb,var(--bg) 86%,transparent);box-shadow:0 0 6px 4px color-mix(in srgb,var(--bg) 86%,transparent)}
.path .pblock .hero-node .hf{filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
/* A tájon a figurák egy halvány korongon állnak, hogy ne olvadjanak bele. */
.path .pblock .hero-node .hf::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--bg) 92%,transparent) 58%,transparent 100%);z-index:-1}
.path .pblock .hero-node .hstars{z-index:1}
.path svg.line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.marker{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;gap:2px;text-align:center;position:relative}
.marker .big{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;border:3px solid var(--surface);box-shadow:0 4px 10px var(--shadow)}
.marker .big.lock{background:var(--surface);border:2px solid var(--border);opacity:.55}
.marker .big.lock svg{width:24px;height:24px;fill:var(--muted)}
.marker b{font-family:Spectral,Georgia,serif;font-size:16px;max-width:220px}
.marker i{font-style:normal;font-size:12px;color:var(--muted)}
.row{height:50px;position:relative}
.phead{display:flex;align-items:baseline;gap:6px;margin:10px 0 4px;font-family:Spectral,Georgia,serif;font-size:15px;font-weight:700;color:var(--text)}
.phead b{color:var(--brand);font-size:16px}
.phead i{margin-left:auto;font-style:normal;font-size:11px;font-weight:600;color:var(--muted)}
.phead.done{opacity:.65}.phead.lock{opacity:.45}
/* A szintlepes sava szandekosan elenkebb, hogy kiugorjon a reszek halvany szinei kozul. */
.testrow{display:flex;justify-content:center;margin:0 -10px;padding:16px 10px 14px;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--pelo,var(--gold)) 13%,var(--bg)) 0 50%,color-mix(in srgb,var(--put,var(--brand2)) 13%,var(--bg)) 50% 100%)}
:root[data-theme="dark"] .testrow{background:linear-gradient(to bottom,color-mix(in srgb,var(--pelo) 17%,var(--bg)) 0 50%,color-mix(in srgb,var(--put) 17%,var(--bg)) 50% 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .testrow{background:linear-gradient(to bottom,color-mix(in srgb,var(--pelo) 17%,var(--bg)) 0 50%,color-mix(in srgb,var(--put) 17%,var(--bg)) 50% 100%)}}
/* A szintlepeshez tapado reszeknel nincs res es nincs lekerekites, hogy a szinek osszeerjenek. */
.pgroup.tlent{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.pgroup.tfent{border-top-left-radius:0;border-top-right-radius:0}
.testnode{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent}
.testnode .tcirc{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(var(--surface),color-mix(in srgb,var(--uc,var(--brand)) 14%,var(--surface)));border:3px dashed var(--uc,var(--brand));box-shadow:0 5px 0 color-mix(in srgb,var(--uc,var(--brand)) 35%,transparent),0 8px 10px var(--shadow);transition:transform .08s,box-shadow .08s}
.testnode:active .tcirc{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--uc,var(--brand)) 35%,transparent),0 3px 6px var(--shadow)}
.testnode .tcirc svg{width:34px;height:34px;fill:var(--uc,var(--brand))}
.testnode .tcirc img{width:52px;height:52px;object-fit:contain}
.testnode:not(.done) .tcirc img{filter:grayscale(.35) opacity(.85)}
.testnode small{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:2px 10px;border-radius:999px}
.testnode.done .tcirc{border-style:solid;border-color:var(--gold);background:linear-gradient(var(--surface),color-mix(in srgb,var(--gold) 20%,var(--surface)));box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 45%,transparent),0 8px 10px var(--shadow)}
.testnode.done .tcirc svg{fill:var(--gold)}
.testnode.done small{color:var(--gold)}
.testnode.skip .tcirc{border-style:solid;border-color:var(--correct)}
.testnode.skip .tcirc svg{fill:var(--correct)}
.pskip{text-align:center;font-size:11px;font-weight:700;color:var(--muted);margin:10px 0;letter-spacing:.03em}
button.pskip.pmore{display:block;width:100%;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--brand)}
button.pskip.pmore:active{transform:scale(.98)}
.pref{font-size:12px;font-weight:700;color:var(--gold);margin:-8px 0 12px}
.node.n-story .dot{background:linear-gradient(var(--surface),#EDE9FF);--edge:#C9C0EC}
.node.n-story .dot svg{width:22px;height:22px;fill:var(--brand)}
.node.n-story.done .dot{background:linear-gradient(color-mix(in srgb,var(--uc) 85%,#fff),var(--uc));--edge:color-mix(in srgb,var(--uc) 65%,#000)}
.node.n-chest .dot{background:none;box-shadow:none;border:0;width:52px;height:42px}
.node.n-chest .dot::after{display:none}
.node .num{color:#fff}
.node .mark{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.row.chestrow{height:64px}
.node{position:absolute;top:0;width:104px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:0}
.node:disabled{cursor:default}
.node .dot{width:52px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--surface);color:#fff;position:relative;margin-bottom:0;
  --edge:color-mix(in srgb,var(--border) 60%,#000 0%);box-shadow:0 6px 0 var(--edge),0 8px 8px var(--shadow);transition:transform .08s,box-shadow .08s}
.node .dot::after{content:"";position:absolute;left:12%;right:12%;top:8%;height:34%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.node:not(:disabled):active .dot{transform:translateY(6px);box-shadow:0 2px 0 var(--edge),0 3px 6px var(--shadow)}
.node .dot svg{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.node.done .dot,.node.open .dot{background:linear-gradient(color-mix(in srgb,var(--uc) 85%,#fff),var(--uc));--edge:color-mix(in srgb,var(--uc) 65%,#000)}
.node.done .dot svg{fill:var(--star);color:var(--star)}.node.done .dot svg.s1{fill:none;color:#fff}
.ring{position:absolute;left:50%;top:50%;width:68px;height:60px;margin:-28px 0 0 -34px;border-radius:50%;border:4px solid var(--uc);pointer-events:none;animation:pulse 1.5s ease-in-out infinite}
.node .ring{top:calc(50% + 3px)}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.06);opacity:.9}}
.node.open.nohearts .dot{opacity:.5}
.node.locked .dot{opacity:.55;--edge:color-mix(in srgb,var(--muted) 45%,transparent)}.node.locked .dot svg{fill:var(--muted);width:16px;height:16px;filter:none}
.node small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-6px;font-size:9px;font-weight:800;color:var(--muted);white-space:nowrap;background:var(--bg);padding:1px 6px;border-radius:999px;z-index:2}
/* Modulsav – az Apple listasorainak mintajara: bal oldalt a jelveny gombja,
   utana egy vekony elvalaszto vonal, majd a szoveg, a sor vegen a jelzes. */
.mbar{position:sticky;top:34px;z-index:3;display:flex;align-items:center;color:#fff;padding:8px 14px 8px 8px;border-radius:16px;box-shadow:0 4px 10px var(--shadow);margin:6px 0 2px}
.mbar .mbadge{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.2);overflow:hidden;transition:transform .08s}
.mbar .mbadge img{width:46px;height:46px;object-fit:contain;display:block}
.mbar .mbadge b{font-family:Spectral,Georgia,serif;font-size:21px;font-weight:700}
.mbar .mbadge:active{transform:scale(.93)}
.mbar .mdiv{flex:none;width:1px;height:36px;margin:0 13px;background:rgba(255,255,255,.4)}
.mbar .mtx{flex:1;min-width:0}
.mbar .mtx small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;opacity:.9}
.mbar .mtx b{display:block;font-family:Spectral,Georgia,serif;font-size:18px;line-height:1.2}
.mbar>svg{flex:none;width:17px;height:17px;fill:currentColor;opacity:.75;margin-left:8px}
/* A zart modul is a sajat szinet kapja, nem feher marad. */
.mbar.lock{position:static;background:color-mix(in srgb,var(--mc) 45%,var(--surface));color:var(--text);
  border:1px solid color-mix(in srgb,var(--mc) 62%,transparent);box-shadow:none;margin:8px 0 0}
.mbar.lock .mbadge{background:var(--mc);color:#fff}
.mbar.lock .mdiv{background:color-mix(in srgb,var(--mc) 55%,transparent)}
.mbar.lock .mtx small{opacity:1;color:color-mix(in srgb,var(--mc) 70%,var(--text))}
/* A lap aljan mindig latszik a kovetkezo modul sava, hogy konnyu legyen atlepni ra. */
.mnext{position:absolute;left:14px;right:14px;bottom:70px;z-index:6;display:flex;align-items:center;color:#fff;
  padding:7px 54px 7px 7px;border-radius:16px;box-shadow:0 8px 20px -6px var(--shadow);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.mnext.on{opacity:1;transform:none;pointer-events:auto}
/* Amikor lap vagy kartya nyilik meg (a sotetito hatter latszik), a sav tunjon el. */
#scrim.show ~ .mnext{opacity:0;transform:translateY(10px);pointer-events:none}
.mnext.on:active{transform:scale(.985)}
.mnext .mbadge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.2);overflow:hidden}
.mnext .mbadge img{width:38px;height:38px;object-fit:contain;display:block}
.mnext .mbadge b{font-family:Spectral,Georgia,serif;font-size:18px;font-weight:700}
.mnext .mdiv{flex:none;width:1px;height:30px;margin:0 11px;background:rgba(255,255,255,.4)}
.mnext .mtx{flex:1;min-width:0}
.mnext .mtx small{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnext .mtx b{display:block;font-family:Spectral,Georgia,serif;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnext.lock{background:color-mix(in srgb,var(--mc) 45%,var(--surface));color:var(--text);border:1px solid color-mix(in srgb,var(--mc) 62%,transparent);box-shadow:0 6px 16px -8px var(--shadow)}
.mnext.lock .mbadge{background:var(--mc);color:#fff}
.mnext.lock .mdiv{background:color-mix(in srgb,var(--mc) 55%,transparent)}
.mnext.lock .mtx small{color:color-mix(in srgb,var(--mc) 70%,var(--text))}
.mbar.lock .mtx small{color:color-mix(in srgb,var(--mc) 60%,var(--muted))}
.mbar.lock>svg{fill:color-mix(in srgb,var(--mc) 55%,var(--muted));opacity:1}
/* Reszvalaszto lap: inset listastilus, mint az iOS beallitasaiban. */
.picklist{max-height:54vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:14px;padding:4px}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;background:none;text-align:left}
.pickrow+.pickrow{border-top:1px solid var(--border)}
.pickrow .pnum{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;
  font-size:13px;font-weight:800;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.pickrow.done .pnum{background:var(--correct);border-color:var(--correct);color:#fff}
.pickrow.now .pnum{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pickrow .ptx{flex:1;min-width:0}
.pickrow .ptx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickrow .ptx small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.pickrow svg{flex:none;width:14px;height:14px;fill:var(--muted)}
.pickrow.done svg{fill:var(--correct)}
.pickrow.lock{opacity:.5;cursor:default}
.picknote{margin:10px 2px 2px;font-size:13px;line-height:1.45;color:var(--muted);text-align:center}
/* Ladabol nyert szorzo: az allapotsorban es a lada megnyitasakor. */
.srow .st.boost{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--gold) 20%,var(--surface));border:1px solid var(--gold);color:var(--gold)}
.srow .st.boost b{font-size:15px;font-weight:800}
.srow .st.boost i{font-style:normal;font-size:10px;font-weight:700;opacity:.85}
.boostwon{margin:8px auto 0;max-width:280px;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:700;
  background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1.5px solid var(--gold);color:var(--gold)}
.boostwon b{font-size:19px;font-weight:800;margin-right:4px}
.chest{position:absolute;top:-2px;transform:translateX(-50%);width:56px;height:56px;display:grid;place-items:center}
.chest .ring{--uc:var(--gold);width:78px;height:72px;margin:-36px 0 0 -39px}
.chest.locked{opacity:.55;cursor:default}.chest.locked .cbox,.chest.locked .cimg{filter:saturate(.2)}
.chest.claimed{opacity:.75;cursor:default}
.chest.ready::before{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:color-mix(in srgb,var(--star) 35%,transparent);filter:blur(10px)}
.chest .lk{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);display:grid;place-items:center}
.chest .lk svg{width:12px;height:12px;fill:#fff}
/* drawn treasure chest; size via font-size */
.cbox{position:relative;display:inline-block;width:1em;height:.82em;font-size:54px;perspective:2.2em;filter:drop-shadow(0 .04em .06em var(--shadow))}
.cbox .lid{position:absolute;left:0;right:0;top:0;height:.34em;border-radius:.26em .26em .04em .04em;background:linear-gradient(var(--lid),var(--wood));box-shadow:inset 0 0 0 1px rgba(154,91,44,.7);transform-origin:bottom;transition:transform .45s;z-index:2}
.cbox .lid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:.11em;transform:translateX(-50%);background:var(--gold)}
.cbox .bod{position:absolute;left:0;right:0;top:.34em;bottom:0;border-radius:.08em;background:linear-gradient(var(--wood),color-mix(in srgb,var(--wood) 80%,#000 0%));box-shadow:inset 0 0 0 1px rgba(154,91,44,.7)}
.cbox .bod::before{content:"";position:absolute;left:0;right:0;top:0;height:.11em;background:var(--gold)}
.cbox .bod::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:.11em;transform:translateX(-50%);background:var(--gold)}
.cbox .lock{position:absolute;left:50%;top:.42em;width:.22em;height:.22em;transform:translateX(-50%);background:var(--gold);border:1px solid var(--wood);border-radius:.05em;z-index:3;display:grid;place-items:center}
.cbox .lock::after{content:"";width:.07em;height:.07em;border-radius:50%;background:var(--wood)}
.cbox.open .lid{transform:rotateX(-70deg);z-index:0}
.cbox .spark{display:none;position:absolute;left:50%;top:.02em;transform:translateX(-50%);width:.42em;height:.42em;fill:var(--star);filter:drop-shadow(0 0 .12em var(--star));z-index:3}
.cbox.open .spark{display:block}

/* bottom bar */
.bar{display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted)}
.bar button svg{width:22px;height:22px;fill:currentColor}
.bar button.on{color:var(--brand)}
.bar .menu-dot{width:28px;height:28px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
.bar .menu-dot svg{width:15px;height:15px;fill:var(--brand-ink)}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);transform:translateY(calc(105% + 120px));transition:transform .25s ease}
.sheet.show{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 12px}
.xclose{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.xclose svg{width:14px;height:14px;fill:var(--muted)}
.sheet h4{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;background:var(--bg);margin-bottom:8px;font-size:16px;font-weight:600}
/* Hibabejelento: a sorok kivalaszthatok, alattuk sajat szoveges mezo. */
.mrow.rkind{position:relative;padding-right:40px}
.mrow.rkind .tick{position:absolute;right:12px;width:18px;height:18px;fill:var(--brand);opacity:0}
.mrow.rkind.sel{background:color-mix(in srgb,var(--brand) 12%,var(--bg));box-shadow:inset 0 0 0 1.5px var(--brand)}
.mrow.rkind.sel .tick{opacity:1}
.rnote{display:block;margin:12px 0 10px}
.rnote span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.rnote textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;resize:vertical;min-height:72px}
.rnote textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.rep em{display:block;font-style:normal;font-size:13px;color:var(--text);margin:2px 0}
.mrow svg{width:18px;height:18px;fill:var(--brand);flex:none}
.mrow .chev{margin-left:auto;fill:var(--muted);width:13px;height:13px}
.mrow .mtx{flex:1;min-width:0}
.mrow .mtx b{display:block;font-size:15px}
.mrow .mtx span{display:block;font-size:11px;font-weight:600;color:var(--muted);line-height:1.25;margin-top:2px}
.mrow .det{margin-left:auto;font-weight:400;font-size:14px;color:var(--muted);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.off{opacity:.45;cursor:default}
.lang{margin-left:auto;display:flex;gap:6px}
.lang button{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;font-weight:700}
.lang button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* Nyelvvalaszto a legelso inditasnal es a szintfelmeron: kozepre kerul, nem a sor vegere. */
.lang.langpick{margin:0 auto 14px;justify-content:center}
.lang.langpick.small button{padding:5px 12px;font-size:12px;border-radius:7px}
/* Ki jatszik most: a sav alatt lenyilo kis menu, hogy egy koppintassal lehessen nevet valtani. */
.whowrap{position:relative}
.whomenu{position:absolute;left:0;right:0;top:100%;margin-top:5px;z-index:8;background:var(--surface);
  border:1.5px solid var(--border);border-radius:14px;box-shadow:0 12px 26px var(--shadow);padding:5px;
  animation:popin .16s cubic-bezier(.34,1.5,.64,1);transform-origin:50% 0}
.whomenu .wrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.whomenu .wrow+.wrow{border-top:1px solid var(--border)}
.whomenu .wrow img.mascot,.whomenu .wrow .mascot{width:34px;height:34px;flex:none}
.whomenu .wrow b{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whomenu .wrow.on{background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.whomenu .wrow.on b{font-weight:700;color:var(--brand)}
.whomenu .wrow svg{flex:none;width:15px;height:15px;fill:var(--correct)}
.whomenu .wadd{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-top:1px solid var(--border);
  font-size:14px;font-weight:700;color:var(--brand)}
.whomenu .wadd svg{width:16px;height:16px;fill:var(--brand);flex:none}
.whobar.open svg:last-child{transform:rotate(90deg)}
.field{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin:6px 0 12px}
.field:focus{outline:2px solid var(--brand);outline-offset:1px}
.lbl{font-size:16px;font-weight:600}

/* collection */
.hrow{display:flex;align-items:baseline}
.pill-right{margin-left:auto;font-size:13px;font-weight:600;color:var(--gold)}
.card-bal{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:14px}
.card-bal b{display:block;font-size:16px}.card-bal span{font-size:12px;color:var(--muted)}
.intro{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;margin:14px 0;flex-wrap:wrap}
.mblurb{margin:-2px 2px 10px;font-size:12px;line-height:1.4;color:var(--muted)}
.soonrow{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;font-weight:700;color:var(--muted)}
.soonrow svg{width:13px;height:13px;fill:var(--brand)}
.mh{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-family:Spectral,Georgia,serif;font-size:16px;font-weight:700}
.mh .me{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#fff;flex:none}
.mh .lk{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.mh .lk svg{width:12px;height:12px;fill:currentColor}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.gc.own{border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.gc .em{font-size:36px;padding-top:4px;line-height:1}
.gc:not(.own) .em{filter:grayscale(1);opacity:.45}
.gc.lock .em{opacity:.25}
.gc .nm{font-size:11px;font-weight:600;height:30px;display:flex;align-items:center;text-align:center;line-height:1.2}
.gc .own-l{display:flex;gap:4px;align-items:center;color:var(--gold);font-weight:700;font-size:12px;padding:7px 0}
.gc .own-l svg{width:13px;height:13px;fill:currentColor}
.gc .buy{width:100%;display:flex;justify-content:center;align-items:center;gap:4px;padding:7px 0;border-radius:8px;font-size:12px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.gc .buy .coin{width:13px;height:13px}
.gc .buy:disabled{background:var(--bg);color:var(--muted);border:1px solid var(--border);cursor:default}
.gc .buy svg{width:12px;height:12px;fill:currentColor}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .t{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600}
.tile .t svg{width:13px;height:13px;fill:currentColor}
.tile .v{font-family:Spectral,Georgia,serif;font-size:20px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:12px;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:18px}
.cal .hd{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.cal .hd b{color:var(--text);font-size:14px;min-width:130px;text-align:center}
.cal .hd button{width:32px;height:32px;display:grid;place-items:center}
.cal .hd button svg{width:14px;height:14px;fill:var(--brand)}
.cal .hd button:disabled{opacity:.35;cursor:default}
.cal .hd .sp{flex:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;margin-top:10px;text-align:center}
.days .w{font-size:11px;font-weight:700;color:var(--muted)}
.days .d{height:34px;display:grid;place-items:center;position:relative;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.days .d::before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;left:50%;top:0;transform:translateX(-50%)}
.days .d span{position:relative}
.days .d.s::before{background:linear-gradient(135deg,#3DD66A,#1E9E4A);box-shadow:0 2px 4px rgba(30,158,74,.35)}.days .d.s span{color:#fff;font-weight:700}
.days .d img.ci{position:absolute;left:50%;top:-1px;width:36px;height:36px;transform:translateX(-50%);object-fit:contain}
.days .d:has(img.ci)::before,.days .d:has(img.ci)::after{display:none}.days .d:has(img.ci) span{color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.days .d.m::before{background:var(--ice)}.days .d.m span{color:var(--ice-ink);transform:translateY(-3px)}
.days .d.m::after{content:"❄";position:absolute;left:50%;transform:translateX(-50%);bottom:1px;font-size:9px;color:var(--ice-ink)}
.days .d.t::before{box-shadow:inset 0 0 0 2px var(--brand)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.sum{font-size:13px;font-weight:600;margin-top:6px}

/* lesson */
.back{font-size:14px;color:var(--muted);text-decoration:underline;margin:0 0 14px;display:inline-block}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:16px}
.top .ltag{white-space:nowrap}
.top .hearts{display:inline-flex;align-items:center;gap:5px;font-size:12px;letter-spacing:0;white-space:nowrap}
.top .hearts b{font-size:17px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.top .hearts img.fic{width:20px;height:20px;margin:0}
.hearts{letter-spacing:2px;font-size:16px}
.pbar{height:12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);overflow:hidden;margin-bottom:18px}
/* A csik elott egy X: egy koppintassal vissza az osvenyre. */
.prow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.prow .pbar{flex:1;margin-bottom:0}
.xback{width:32px;height:32px;flex:none;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center}
.xback svg{width:13px;height:13px;fill:var(--muted)}
.xback:active{transform:scale(.92)}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34C759,#22A559);transition:width .35s ease}
.pbar.rev i{background:linear-gradient(90deg,#FF8A65,var(--wrong))}
.rt{display:inline-flex;align-items:center;gap:4px;margin:-10px 0 14px;font-size:12px;font-weight:700;color:var(--wrong)}
.rt svg{width:12px;height:12px;fill:currentColor}
.ltag{display:inline-flex;align-items:center;gap:6px}
.ltag img{width:22px;height:22px;object-fit:contain}
.ltag b{color:var(--text)}
.dots{display:flex;gap:5px;margin-bottom:20px}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--border)}
.dots i.f{background:var(--gold);border-color:var(--gold)}.dots i.c{border-color:var(--gold)}
.dots.rev i.f{background:var(--wrong);border-color:var(--wrong)}.dots.rev i.c{border-color:var(--wrong)}
.dots .rt{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:12px;font-weight:700;color:var(--wrong);line-height:9px}
.dots .rt svg{width:12px;height:12px;fill:currentColor}
.q{font-family:Spectral,Georgia,serif;font-size:20px;font-weight:600;line-height:1.35;margin-bottom:20px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.img{display:grid;grid-template-columns:1fr 1fr}
.opt{display:block;width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-size:16px;font-weight:500;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt:disabled{cursor:default;transform:none}
.opt.ok{border-color:var(--correct);background:color-mix(in srgb,var(--correct) 16%,var(--surface))}
.opt.bad{border-color:var(--wrong);background:color-mix(in srgb,var(--wrong) 16%,var(--surface))}
.opt.pic{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;font-size:13px;font-weight:600;text-align:center}
.opt.pic svg{width:38px;height:38px;color:var(--text)}
.primary{display:block;width:100%;text-align:center;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;padding:15px;border-radius:10px}
.secondary{display:block;width:100%;text-align:center;color:var(--text);font-weight:600;font-size:16px;padding:14px;border-radius:10px;border:1.5px solid var(--border)}
.footpad{padding:8px 18px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg)}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.footpad .primary{animation:up .18s ease-out}

/* result / chest */
.center{text-align:center;padding-top:30px}
.center .emoji{font-size:42px}
.center h2{font-family:Spectral,Georgia,serif;font-size:24px;margin:6px 0 10px;text-wrap:balance}
.center .xp{font-family:Spectral,Georgia,serif;font-size:38px;font-weight:700;color:var(--gold);line-height:1.1}
.center .m{font-size:15px;color:var(--muted);margin-top:6px}
.center .box{margin:14px auto 0;background:var(--surface);border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:14px;font-weight:700;font-size:15px}
.center .box.red{border-color:var(--wrong);color:var(--wrong)}
.center .acts{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.center .cbox{margin:20px 0}
.gain{display:flex;justify-content:center;align-items:center;gap:8px}
.gain .xp{font-size:30px;white-space:nowrap}
.gain .coin{width:30px;height:30px}
.stars{display:flex;justify-content:center;align-items:center;gap:10px;height:70px;margin-bottom:6px}
.stars svg{width:42px;height:42px;fill:var(--border);color:var(--border);transform:scale(.3);opacity:0;animation:pop .4s cubic-bezier(.34,1.56,.64,1) forwards}
.stars svg:nth-child(2){width:54px;height:54px;margin-top:-16px}
.stars svg:nth-child(1){animation-delay:.15s}.stars svg:nth-child(2){animation-delay:.37s}.stars svg:nth-child(3){animation-delay:.59s}
.stars svg.on{fill:var(--star);color:var(--star);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--star) 60%,transparent))}
@keyframes pop{to{transform:none;opacity:1}}
.sub2{font-size:14px;color:var(--muted);margin:0 0 8px}
.rimg img{width:120px;height:120px;object-fit:contain;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.stars.small{height:40px;margin-top:-6px}.stars.small svg{width:26px;height:26px}.stars.small svg:nth-child(2){width:32px;height:32px;margin-top:-6px}
.tgain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:6px;font-size:17px;font-weight:700}
.tgain .tv{white-space:nowrap}
.tgain .coin{width:26px;height:26px}
.tgain .mult{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));border-radius:999px;padding:4px 8px}
.spin{animation:spin 1.1s ease-in-out 3;transform-style:preserve-3d}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
/* result: Olivia on top, spinning in, her line right below */
.rtop{display:flex;flex-direction:column;align-items:center;gap:8px;margin:-16px 0 14px}
.rtop .twirl{animation:twirl 1s cubic-bezier(.34,1.3,.5,1) 1}
.rtop .mascot{width:88px;height:88px}
.rtop .bubble{max-width:280px;font-size:13px;padding:8px 12px}
.rtop .bubble::after{left:50%;top:-5px;bottom:auto;transform:translateX(-50%) rotate(45deg)}
@keyframes twirl{0%{transform:rotateY(0) scale(.6);opacity:0}40%{opacity:1}100%{transform:rotateY(360deg) scale(1);opacity:1}}
.rmascot{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 4px}
.rmascot .mascot{width:56px;height:56px}
.rmascot .bubble{max-width:200px;text-align:left;font-size:13px}
.rmascot .bubble::after{left:-5px;bottom:auto;top:50%;transform:translateY(-50%) rotate(45deg)}
/* week strip */
/* Three little scoreboards on the result screen. */
.scorow{display:flex;gap:8px;margin:14px 0 4px}
.sbox{flex:1;min-width:0;border-radius:14px;border:2px solid var(--border);background:var(--surface);padding:8px 4px 7px}
.sbox small{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sbox b{display:block;font-family:Spectral,Georgia,serif;font-size:21px;line-height:1.15;margin-top:1px}
.sbox i{display:block;font-style:normal;font-size:10px;font-weight:700;margin-top:2px;line-height:1.2;overflow-wrap:anywhere}
.sbox.gold{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}.sbox.gold b,.sbox.gold i{color:var(--gold)}
.sbox.green{border-color:var(--correct);background:color-mix(in srgb,var(--correct) 12%,var(--surface))}.sbox.green b,.sbox.green i{color:var(--correct)}
.sbox.blue{border-color:var(--ice-ink);background:color-mix(in srgb,var(--ice-ink) 10%,var(--surface))}.sbox.blue b,.sbox.blue i{color:var(--ice-ink)}
.stopbig{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:6px}
.stopbig img.sbig{width:72px;height:72px;object-fit:contain}
.stopbig b{font-family:Spectral,Georgia,serif;font-size:44px;line-height:1;color:var(--gold)}
.stopbig span{font-size:13px;font-weight:700;color:var(--muted)}
.weekprize{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
.week{display:flex;justify-content:space-between;gap:4px;margin:16px auto 0;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.week .wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--muted);width:36px}
.week .wd i{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-style:normal}
.week .wd i svg{width:14px;height:14px;fill:#fff}
.week .wd.s i{background:var(--gold);border-color:var(--gold)}
.week .wd.t i{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.week .wd.t{color:var(--brand)}
.week .wd.c i{border:0;width:34px;height:28px;line-height:0;overflow:visible}
.week .wd.c .cbox{font-size:28px;margin:0}
.week .wd.c.s .cbox,.week .wd.c.s .cimg{filter:drop-shadow(0 0 6px var(--star))}
.week .wd.c:not(.s) .cbox,.week .wd.c:not(.s) .cimg{filter:saturate(.35);opacity:.7}
/* tap-to-open chest */
.tapchest{display:block;margin:6px auto 0;position:relative;width:200px;height:200px;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.tapchest .cbox{font-size:150px}
.tapchest .cimg{width:170px!important;height:170px!important}
.cimg{object-fit:contain;vertical-align:middle;display:inline-block}
.tapchest.idle .cbox,.tapchest.idle .cimg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.tapchest.w1 .cbox,.tapchest.w1 .cimg{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
.tapchest.w2 .cbox,.tapchest.w2 .cimg{animation:shake2 .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,0) rotate(-3deg)}20%,80%{transform:translate(4px,0) rotate(4deg)}30%,50%,70%{transform:translate(-8px,0) rotate(-6deg) scale(1.05)}40%,60%{transform:translate(8px,0) rotate(6deg) scale(1.05)}}
@keyframes shake2{10%,90%{transform:translate(2px,0) rotate(3deg)}20%,80%{transform:translate(-4px,0) rotate(-4deg)}30%,50%,70%{transform:translate(8px,0) rotate(6deg) scale(1.07)}40%,60%{transform:translate(-8px,0) rotate(-6deg) scale(1.07)}}
.tapchest.opened .cbox,.tapchest.opened .cimg{animation:popopen .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes popopen{0%{transform:scale(.9)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tapchest .lid{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tapchest.t1 .lid{transform:rotateX(-14deg)}.tapchest.t2 .lid{transform:rotateX(-30deg)}
.tapchest .p{position:absolute;left:50%;top:45%;font-size:22px;pointer-events:none;animation:fly .9s ease-out forwards;opacity:0}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r));opacity:0}}
.tapchest.opened .p{animation-duration:1.4s;font-size:26px}
.tapchest .glow{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--star) 45%,transparent),transparent 70%);opacity:0;transition:opacity .4s}
.tapchest.opened .glow{opacity:1}
.tapme{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-4px;color:var(--brand);font-size:14px;font-weight:800}
.tapme svg{width:30px;height:30px;fill:var(--brand);animation:bounceup 1s ease-in-out infinite}
@keyframes bounceup{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.tdots{display:flex;justify-content:center;gap:8px;margin-top:6px}
.tdots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--brand);transition:background .15s}
.tdots i.f{background:var(--brand)}
.reveal{animation:up .35s ease-out}
.tiny{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
</style>

// minden megjott; a betoltes alatt a fenti porgo karika latszik.
(function(){
'use strict';
// A "no-cache" nem azt jelenti, hogy nem gyorstaraz, hanem hogy minden
// inditaskor rakerdez: valtozott-e a fajl. Ha nem, a kiszolgalo csak annyit

// visszatero jatekosnak csak az ujrairt modul toltodik le megint.
function hoz(u){ return fetch(u,{cache:'no-cache'}).then(function(r){
  if(!r.ok) throw new Error(u+' – '+r.status); return r.json(); }); }
hoz('data/core.json').then(function(core){
  var ids = core.modules.map(function(m){ return m.id; });
  return Promise.all(ids.map(function(id){ return hoz('data/'+id+'.json'); }))
    .then(function(reszek){
      reszek.forEach(function(r,i){
        core.modules[i].parts = r.parts||[];
        if(r.heroes) core.modules[i].heroes = r.heroes;
      });
      return core;
    });
}).then(function(C){
  var b=document.getElementById('boot'); if(b) b.remove();

});
})();

tion(n){return 'Ismétlésért '+n+' XP · teljes jutalom 3 csillagnál'},readAgainHint:'A történetet bármikor újra elolvashatod – ezért már nem jár XP.',replayNote:'Ismétlés – a teljes jutalomhoz három csillag kell.',replayHint:function(n){return 'Ismétlésért '+n+' XP jár. A teljes jutalomhoz mind a három csillagot meg kell szerezned.'},trophyTag:'A modul jutalma',trophyLocked:function(d,t){return 'Teljesítsd a modult ('+d+'/'+t+' állomás), és feloldódik!'},heroPerfect:'Hős-küldetés hibátlanul!',heroesTitle:'Hősök',heroLockedAt:function(n){return 'Teljesítsd a(z) '+n+'. állomást, és megnyílik'},heroNeed3:'Három csillaggal színesedik ki',heroDone:'Kiszínezve – hibátlan küldetés!',heroStart:'Küldetés indítása',heroAgain:'Újra megpróbálom',heroLocked:'Teljesítsd a modult, és feloldódik!',heroUnlocked:'Feloldva',
    badgeNew:'Új kitüntetés!',matchHint:function(n){return n===1?'Már csak egy pár maradt!':('Koppints egy szóra balra, majd a párjára jobbra. Még '+n+' pár.');},matchOk:'Minden párt megtaláltál!',matchBad:'Végül minden pár megvan – nézd meg újra őket!',profTitle:'Ki játszik most?',profHint:'Egy készüléken több játékos is haladhat, mindenkinek saját története van. Minden a készüléken marad: nincs jelszó és nincs regisztráció.',profNow:'most ő játszik',profNoName:'Névtelen játékos',profManage:'Játékosok kezelése',profNew:'Új játékos felvétele',profSwitch:'váltás',profDelete:'Játékos törlése',profAskName:'Hogy hívják az új játékost?',profDelAsk:function(n){ return n+' haladása véglegesen törlődik. Biztosan törlöd?'; },tourNext:"Tovább",tourDone:"Értem, kezdhetjük!",tourSkip:"Ezt most kihagyom",tourOf:function(a,b){return a+' / '+b;},tour:{home:[["Ez az ösvény","Itt haladsz végig a Biblián, résztől részig. Mindig a zöld kör a következő állomásod – a lakat azt jelenti, hogy oda még nem jutottál el.",".node.open"],["Történet, feladat, láda","Minden rész egy történettel kezdődik. Ha elolvastad, jönnek a feladatok, a végén pedig ez a kincsesláda vár. A ládát ki kell nyitni, különben nem nyílik a következő szakasz.",".node.n-chest"],["Szintlépés","Néhol egy szaggatott körű állomás áll az ösvényen: ez a szintlépés. Ha már tudod az előtte lévő részek anyagát, egy rövid teszttel átugorhatod őket, és rögtön tovább mehetsz. Naponta egyszer próbálhatod meg, és ha most nem sikerül, semmi baj: játszd végig a részeket, úgy is eljutsz oda.",".testnode"],["Modulok","A Biblia nagy szakaszait moduloknak hívjuk, és ez a színes sáv mindig megmutatja, melyikben jársz éppen. Nyolc modul van: a teremtéstől Mózesen és a királyokon át Jézusig és az első keresztényekig. Ahogy haladsz, sorban nyílnak meg.",".mbar"],["Részválasztás","Ha a sáv bal szélén lévő jelvényre koppintasz, kinyílik a modul összes része, és kiválaszthatod, melyiket szeretnéd játszani. Amit már teljesítettél, bármikor újra elővehetsz.",".mbar .mbadge"],["Olívia és a hősök","Az ösvény szélén néha felbukkanok én, meg a Biblia hősei. Ezek külön kis kihívások: ha mind a három csillagot megszerzed, a hős bekerül a gyűjteményedbe.",".hero-node"],["Szívek","Öt szíved van. Ha elrontasz egy kérdést, elveszítesz egyet, és ha mind elfogy, várnod kell. De nem sokat: körülbelül öt percenként visszatöltődik egy magától.","#heartChip"],["Széria","Ez a láng azt mutatja, hány napja tanulsz egymás után. Elég naponta egyetlen lecke, hogy a széria megmaradjon – ez a legfontosabb szokás az egészben.",".srow .st.c-gold"],["Pajzs","És ha egy nap mégis kimarad? Akkor a pajzs megvédi ezt a lángot: befagyasztja a szériádat, mintha ott lettél volna. Pajzsot a Gyűjtemény boltjában vehetsz talentumból.",".srow .st.c-gold"],["Talentum","Ez az aranyérme a talentum. A ládákból és a jó megoldásokból gyűlik, és a boltban költheted el: pajzsra, meg a gyűjteménybe való kincsekre.",".srow [data-tab=\"collection\"]"],["A mai cél","Itt mindig látod, megvan-e már a mai leckéd. Egy lecke naponta – ennyi kell ahhoz, hogy haladj, és hogy én is nőjek melletted.",".goal"]],collection:[["A gyűjteményed","Itt gyűlik minden, amit az úton szerzel. Fent mindig látod, mennyi talentumod van – ebből vásárolsz.",".card-bal"],["Hősök","A Biblia szereplői. Egy hőst úgy szerzel meg, hogy az ösvényen teljesíted a hozzá tartozó kihívást – mind a három csillagra.","#view .hgrid"],["Kincsek","Minden modulhoz tartoznak kincsek – apró emlékek a történetekből. Talentumból veheted meg őket, és csak azok nyílnak ki, amelyek moduljáig már eljutottál.","#view .cards"],["A bolt","Itt költöd el a talentumot. A legfontosabb a pajzs: ez menti meg a szériádat, ha egy nap kimarad.","#view .shop .item","coltab:shop"]],stats:[["A haladásod","Ezen az oldalon látod egyben, hogyan állsz: mennyit tanultál, mit gyűjtöttél, és mi vár még rád.","#view .tiles"],["Szint és XP","Minden jó válaszért XP-t kapsz. Ahogy gyűlik, lépsz egyet a szinteken: Újonc, Tanuló, Tanítvány, és így tovább egészen a Bibliaút mesteréig.","#view .tile"],["Naptár","A naptár megmutatja, mely napokon tanultál. A zöld nap azt jelenti: aznap megvolt a leckéd. A kék hópehely azt, hogy ott a pajzs fagyasztotta be a szériádat.","#view .cal"],["Kitüntetések","Ezeket gyűjtöd útközben: az első állomásért, az első ládáért, a hosszú szériákért. Koppints rá bármelyikre, és megmutatom, mi kell hozzá.","#view .bgrp"]],menu:[["A menü","Innen éred el mindazt, ami nem fér ki az ösvényre: a profilodat, a beállításokat és a hibajavítót.","#sheet [data-profilepage]"],["Beállítások","Itt állíthatod a nyelvet, a világos vagy sötét megjelenést, és azt is, milyen nehéz kérdéseket kapj: kezdő, középhaladó vagy haladó.","#sheet [data-settings]"],["Hibák javítása","Amit elsőre elrontasz, ide gyűlik. Bármikor átgyakorolhatod, és ami itt elsőre sikerül, lekerül a listáról.","#sheet [data-fix]"],["Hibás kérdés?","Ha valamelyik kérdéssel baj van, a kérdés alatti „Hibás ez a kérdés?” linkkel szólhatsz. Megnézzük és kijavítjuk.",""]]},introHi:'Szia! Olívia vagyok.',introTitle:'Kezdjük egy rövid felméréssel',introWho:'Én kísérlek végig az úton: mesélek, kérdezek, és ha elakadsz, segítek. Ahogy te haladsz, úgy növök én is – minél többet tanulsz, annál nagyobb leszek.',introBody:'Előbb viszont tegyünk fel 20 kérdést, hogy lássam, mennyit tudsz már a Bibliából. Így olyan feladatokat kapsz, amelyek se nem túl könnyűek, se nem túl nehezek. Nem osztályzat ez: itt nem lehet rontani, és szívet sem veszítesz.',introStart:'Kezdjük a felmérést',introSkip:'Most kihagyom',placeTag:'Szintfelmérő',placeHint:'Ha nem tudod, nyugodtan tippelj – ettől senki nem lesz szomorú.',placeDone:'Kész is! Nézzük, hol tartasz.',placeScore:function(a,b){ return a+' jó válasz a '+b+'-ből'; },placeYourLevel:'Innen indulsz',placePick:'Ha szeretnéd, választhatsz másikat is – nyugodtan kezdj könnyebben, ha úgy jobb:',placeChosen:'· ezt választottad',placeGo:'Indulhat az út!',placeMove:'Ez a szint nem végleges. Ahogy játszol, a játék magától figyeli, hogyan megy, és lépked veled fölfelé vagy lefelé. A Menü → Beállítások alatt bármikor át is állíthatod magadnak.',diffTitle:'Nehézségi szint',kindReport:{mc:'Kérdések',tf:'Igaz vagy hamis',who:'Ki vagyok én?',fill:'Hiányzó szó',pic:'Képfelismerés',lesson:'Mit tanít?',order:'Sorrend',match:'Párosítás',timeline:'Idővonal',map:'Térkép',color:'Színezős'},diffName:{e:'Kezdő',m:'Középhaladó',h:'Haladó'},diffShort:{e:'Rövidebb történetek, egyszerű kérdések',m:'Bővebb történetek, több részlet',h:'Hosszú történetek, összefüggések és háttér'},diffDesc:{e:'A történeteket rövidebben és egyszerűbb szavakkal kapod, a kérdések pedig a legfontosabb dolgokra kérdeznek rá. Jó választás, ha most ismerkedsz a Bibliával.',m:'Bővebb történeteket kapsz, több névvel és részlettel, a kérdések pedig már összefüggésekre is rákérdeznek. Jó választás, ha a legtöbb történetet már hallottad.',h:'Hosszabb történeteket kapsz háttérrel és magyarázattal, a kérdések pedig okokat, összefüggéseket és utalásokat kérnek. Jó választás, ha jól ismered a Bibliát.'},badgesTitle:'Kitüntetések',badgeEarned:'Megszerezted!',badgeLocked:'Még nincs meg',

you can always come back to.",".mbar .mbadge"],["Olivia and the heroes","Along the path you will sometimes meet me and the heroes of the Bible. These are little side challenges: earn all three stars and the hero joins your collection.",".hero-node"],["Hearts","You have five hearts. A wrong answer costs one, and if they all run out you have to wait. Not for long though: one comes back on its own about every five minutes.","#heartChip"],["Streak","This flame shows how many days in a row you have studied. One lesson a day is enough to keep the streak — that is the most important habit here.",".srow .st.c-gold"],["Shield","And if you do miss a day? A shield protects this flame: it freezes your streak, as if you had been there. You buy shields with talents in the collection shop.",".srow .st.c-gold"],["Talents","This gold coin is a talent. They come from chests and from good answers, and you spend them in the shop: on shields and on treasures for your collection.",".srow [data-tab=\"collection\"]"],["Today’s goal","Here you can always see whether today’s lesson is done. One lesson a day — that is all it takes to keep moving, and to help me grow beside you.",".goal"]],collection:[["Your collection","Everything you earn on the way gathers here. At the top you can always see how many talents you have — that is what you spend.",".card-bal"],["Heroes","The people of the Bible. You earn a hero by finishing their challenge on the path — with all three stars.","#view .hgrid"],["Treasures","Every module has its own treasures — small keepsakes from the stories. You buy them with talents, and only the ones from modules you have reached will open.","#view .cards"],["The shop","This is where you spend your talents. The most important item is the shield: it saves your streak when you miss a day.","#view .shop .item","coltab:shop"]],stats:[["Your progress","This page shows everything at a glance: how much you have studied, what you have collected and what is still ahead.","#view .tiles
