};
function T(){ return STR[S.lang]; }
function L(o){ return o&&o.name!=null?o.name:(o?o[S.lang]:""); }
function NM(o){ if(!o) return "";
  if(S.lang!=='hu'&&o.en&&o.en.name!=null) return o.en.name;
  if(o.name!=null) return o.name;
  return o[S.lang]||o.hu||""; }
// A resz igehelye, tortenete es igeverse a valasztott nyelven.
function REF(p){ return (S.lang!=='hu'&&p&&p.en&&p.en.ref)||(p&&p.ref)||''; }
function STORY(p,d){ var src=(S.lang!=='hu'&&p&&p.en&&p.en.story)?p.en.story:(p&&p.story);
  return (src&&(src[d]||src.m||src.e||src.h))||''; }
function VERSE(p){ return (S.lang!=='hu'&&p&&p.en&&p.en.verse)||(p&&p.verse)||null; }
// Igaz-e, hogy ennek a resznek meg nincs angol szovege?
function needsTranslation(p){ return S.lang!=='hu'&&!(p&&p.en&&p.en.story); }

// ---------- helpers ----------
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
// A tortenetek egyszeru jelolest hasznalnak: **felkover**, *dolt*, "|"-es tablazat es "-" lista.
// Eloszor elrejtjuk a HTML-t (esc), es csak utana tesszuk be a sajat cimkeinket.
function mdin(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>'); }
function sorLista(l){ return /^\s*[-*]\s+/.test(l); }
function storyHtml(txt){
  return String(txt||'').split(/\n{2,}/).map(function(par){
    var sorok=par.split('\n').filter(function(l){ return l.trim(); });
    if(!sorok.length) return '';
    if(sorok.length>1&&sorok.every(function(l){ return /^\s*\|.*\|\s*$/.test(l); })){
      var sor=sorok.filter(function(l){ return !/^\s*\|[\s:|-]+\|\s*$/.test(l); });
      return '<div class="tblwrap"><table class="stbl">'+sor.map(function(l,i){
        var c=l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|'), tag=i===0?'th':'td';
        return '<tr>'+c.map(function(x){ return '<'+tag+'>'+mdin(x.trim())+'</'+tag+'>'; }).join('')+'</tr>';
      }).join('')+'</table></div>';
    }
    if(sorok.every(sorLista)) return '<ul class="stul">'+sorok.map(function(l){ return '<li>'+mdin(l.replace(/^\s*[-*]\s+/,''))+'</li>'; }).join('')+'</ul>';
    return '<p>'+mdin(sorok.join('\n')).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
// Az osveny kis kartyajara es a reszvalasztoba csak az elso mondat kerul.
// A pont utan csak akkor vagunk, ha nem szam all elotte (kulonben "A 23." lenne a vege).
function biztato(lista,r){ if(!lista||!lista.length) return String(lista||'');
  if(typeof lista==='string') return lista;
  var mag=((r&&r.correct)||0)+((r&&r.total)||0)*7+Math.floor(Date.now()/86400000);
  return lista[Math.abs(mag)%lista.length]; }
function elsoMondat(txt){
  var p=String(txt||'').replace(/\*/g,'').split(/\n{2,}/)[0]||'';
  var m=p.split(/(?<=[^\d\s][.!?])\s+(?=[^a-záéíóöőúüű])/)[0]||p;
  return m.trim();
}
// Thousands separator for badge names (space in Hungarian, comma in English).
function gnum(n,sep){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,sep||' '); }
// The drawn icons wherever they exist, with a plain fallback otherwise.
function streakIco(cls){ return img('icon-streak','fic'+(cls?' '+cls:''))||'🔥'; }
function heartIco(on){ var im=img('icon-heart','fic'+(on?'':' off')); return im||(on?'❤️':'🤍'); }
function shieldIco(cls){ return img('cal-shield','fic'+(cls?' '+cls:''))||('<svg class="fsvg"><use href="#i-shield"/></svg>'); }
// The talent coin: the drawn picture wherever it exists, the CSS coin otherwise.
function talentIco(cls){ return img('talent-big','tcoin'+(cls?' '+cls:''))||img('icon-talent','tcoin'+(cls?' '+cls:''))||('<i class="coin'+(cls?' '+cls:'')+'"></i>'); }
// Treasure artwork. The modules are m1…m8 but the pictures were drawn as card-u1…u6, so try both.
function cardImg(g){ return img(g.art||('card-'+g.unit+'-'+g.id))||img('card-'+String(g.unit).replace(/^m/,'u')+'-'+g.id)||g.emoji; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function ico(n){ return '<svg><use href="#i-'+n+'"/></svg>'; }
function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function mmss(ms){ var t=Math.ceil(ms/1000); return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); }
function haptic(kind){ try{ if(navigator.vibrate) navigator.vibrate(kind==='error'?[40,40,40]:20); }catch(e){} }

// ---------- hearts ----------
function pruneHearts(){ var t=Date.now(); var k=S.heartLosses.filter(function(x){return t-x<REGEN;}); if(k.length!==S.heartLosses.length){ S.heartLosses=k; persist(); } }
function hearts(){ pruneHearts(); return Math.max(0,HEARTS-S.heartLosses.length); }
function msToNextHeart(){ if(!S.heartLosses.length) return 0; return Math.max(0,REGEN-(Date.now()-Math.min.apply(null,S.heartLosses))); }
function loseHeart(){ if(S.heartLosses.length<HEARTS){ S.heartLosses.push(Date.now()); persist(); } }

// ---------- progress: modul -> resz -> allomas ----------
// Every part has 8 slots: 0 = story, 1-3 = task, 4 = chest, 5-7 = task.
var SLOTS=8, STORY_SLOT=0, CHEST_SLOT=4, OLIVIA_SLOT=2, HERO_SLOT=6;
// Tiz reszszin korbe a szinkoron; a tizenegyedik resz megint az elsot kapja.
var PART_HUES=['#FF8A3C','#2FBF71','#3CA5FF','#A06BFF','#FFC531','#FF6B8A','#8FC93A','#25BFBF','#C98A4B','#6C7BFF'];
function partHue(pi){ return PART_HUES[((pi%PART_HUES.length)+PART_HUES.length)%PART_HUES.length]; }
function slotKind(slot){ return slot===STORY_SLOT?'story':slot===CHEST_SLOT?'chest':'task'; }
// Task slots 1,2,3,5,6,7 map to the part's 6 task stations 0..5.
function taskIndex(slot){ return slot<CHEST_SLOT?slot-1:slot-2; }
function slotKey(m,p,slot){ return m.id+'-'+p.id+'-'+slot; }
function slotDone(m,p,slot){ return S.progress[slotKey(m,p,slot)]!=null; }
function slotStars(m,p,slot){ var v=S.progress[slotKey(m,p,slot)]; return typeof v==='number'?v:0; }
function markSlot(m,p,slot,val){ S.progress[slotKey(m,p,slot)]=val==null?true:val; }
function partDone(m,p){ for(var i=0;i<SLOTS;i++) if(!slotDone(m,p,i)) return false; return true; }
function partsDoneIn(m){ var n=0; m.parts.forEach(function(p){ if(partDone(m,p)) n++; }); return n; }
function unitComplete(m){ return (m.parts||[]).length>0&&partsDoneIn(m)>=m.parts.length; }
function moduleById(id){ for(var i=0;i<C.modules.length;i++) if(C.modules[i].id===id) return C.modules[i]; return null; }
// Egy modul akkor nyitott, ha az elozo kesz - vagy ha mar van benne tartalom.

// ---------- difficulty (easy / medium / hard) ----------

// using the last 30 answers: >=85% steps up, <65% steps down, one step at a time.
var DIFFS=['e','m','h'], ASSESS_PARTS=3, RECHECK_EVERY=5, MIN_GAP=3, WINDOW=30;

    var best='e'; DIFFS.forEach(function(d){ var r=S.recent.filter(function(x){return x.d===d;}); if(r.length>=4&&r.reduce(function(a,x){return a+x.ok;},0)/r.length>=0.7) best=d; });
    S.diff=best; S.diffSet=done; persist(); return best;

// Turns a content item of a given kind into the shape the lesson renderer understands.

// Draws the questions of one task station: Q_PER_STATION items at the player's level

// Skip test: after every tenth part a test of the previous ten parts. Answer enough of them

  return (img(a.id.indexOf('hero-')===0?a.id:('hero-'+a.id),'mascot'+(cls?' '+cls:''))||mascotHtml(cls)); }
function profilePage(){
  var s=T(), joined=S.firstStudy?new Date(S.firstStudy).getFullYear():new Date().getFullYear();
  var h='<div class="prof"><div class="phead2">'+avatarHtml('pav')+'<div><h1>'+esc(S.name||s.noName)+'</h1><span>'+esc(s.joined(joined))+'</span></div><button type="button" class="edit" data-editname>'+ico('person')+'</button></div>';
  // The name field opens right here under the name, not as a sheet from the bottom.
  if(editingName) h+='<div class="namebox"><label class="lbl" for="nameField">'+esc(s.yourName)+'</label><input id="nameField" class="field" type="text" autocomplete="nickname" placeholder="'+esc(s.namePlaceholder)+'" value="'+esc(S.name)+'"><button type="button" class="primary" data-savename>'+esc(s.save)+'</button></div>';
  h+='<div class="mrow">'+ico('person')+'<div class="mtx"><b>'+esc(s.account)+'</b><span>'+esc(s.accountHint)+'</span></div></div>';
  h+='<h3 class="sh">'+esc(s.charTitle)+'</h3><div class="chars">';
  avatarList().forEach(function(a){ h+='<button type="button" class="ch '+(S.avatar===a.id?'on':'')+'" data-avatar="'+esc(a.id)+'">'+a.html+'<small>'+esc(a.name)+'</small></button>'; });
  h+='<div class="ch soon">'+ico('spark')+'<small>'+esc(s.comingSoon)+'</small></div></div>';
  h+='<h3 class="sh">'+esc(s.overview)+'</h3><div class="tiles">';
  function tile(i,c,t,v,d){ return '<div class="tile"><div class="t '+c+'">'+ico(i)+esc(t)+'</div><div class="v">'+esc(v)+'</div>'+(d?'<div class="d">'+esc(d)+'</div>':'')+'</div>'; }
  h+=tile('book','c-brand',s.statLevel,levelName(),S.xp+' XP')+tile('flame','c-gold',s.statStreak,s.days(displayStreak()),s.bestDays(studyDays()))+
     tile('shield','c-brand',s.shieldsUsedTitle,shieldsUsed(),s.shieldsLeft(S.shields))+tile('cal','c-ice',s.statWeek,s.lessons(lessonsThisWeek()),'');
  return h+'</div></div>';
}
// Settings page – its own screen, grows over time.
function settingsPage(){
  var s=T();
  return '<div class="hrow"><h1 class="brand">'+esc(s.settings)+'</h1></div><div class="setlist">'+
    '<div class="mrow">'+ico('globe')+'<div class="mtx"><b>'+esc(s.language)+'</b></div><span class="lang"><button type="button" data-lang="hu" class="'+(S.lang==='hu'?'on':'')+'">HU</button><button type="button" data-lang="en" class="'+(S.lang==='en'?'on':'')+'">EN</button></span></div>'+
    // A terkep-hatter kapcsolo egyelore rejtve: a hatterkepek meg keszulnek. A logika megvan, csak ezt a sort kell visszatenni.
    '<button type="button" class="mrow" data-reports><svg><use href="#i-flag"/></svg><div class="mtx"><b>'+esc(s.reportsTitle)+'</b></div>'+((S.reports||[]).length?'<span class="det">'+(S.reports||[]).length+'</span>':'')+'<svg class="chev"><use href="#i-chev"/></svg></button>'+
    '<div class="mrow"><svg><use href="#i-theme"/></svg><div class="mtx"><b>'+esc(s.theme)+'</b><span>'+esc(s.themeHint)+'</span></div><span class="lang"><button type="button" data-theme="light" class="'+(S.theme==='light'?'on':'')+'">'+esc(s.themeLight)+'</button><button type="button" data-theme="dark" class="'+(S.theme==='dark'?'on':'')+'">'+esc(s.themeDark)+'</button><button type="button" data-theme="auto" class="'+(S.theme==='auto'||!S.theme?'on':'')+'">'+esc(s.themeAuto)+'</button></span></div>'+
    '<div class="mrow"><svg><use href="#i-chart"/></svg><div class="mtx"><b>'+esc(s.diffTitle)+'</b><span>'+esc(s.diffDesc[S.diff||'m'])+'</span></div></div>'+
    '<div class="difrow">'+DIFFS.map(function(d){ return '<button type="button" class="difbtn'+((S.diff||'m')===d?' on':'')+'" data-setdiff="'+d+'">'+esc(s.diffName[d])+'</button>'; }).join('')+'</div>'+
    '</div>';
}
// "Ki jatszik most" sav es a lenyilo nevvalaszto: egy koppintas nyitja, a masodik valt.
function whoHtml(){ var s=T();
  var h='<div class="whowrap">'+
    '<button type="button" class="whobar'+(whoOpen?' open':'')+'" data-whotoggle>'+ico('person')+
    '<b>'+esc(profilNev(PROFIL)||s.profNoName)+'</b><span>'+esc(s.profSwitch)+'</span>'+ico('chev')+'</button>';
  if(whoOpen){
    h+='<div class="whomenu">';
    PROFILOK.forEach(function(p){ var most=p.id===PROFIL;
      h+='<button type="button" class="wrow'+(most?' on':'')+'" data-profswitch="'+p.id+'">'+
        mascotHtml('pav')+'<b>'+esc(p.name||s.profNoName)+'</b>'+
        (most?'<svg><use href="#i-check"/></svg>':'')+'</button>'; });
    h+='<button type="button" class="wadd" data-profsheet>'+ico('person')+esc(s.profManage)+'</button>';
    h+='</div>'; }
  return h+'</div>'; }
// A jatekosok listaja: koppintasra valt, es uj jatekost is lehet felvenni.
function profilSheet(){ var s=T();
  var h='<h4>'+esc(s.profTitle)+'</h4><p class="rhint" style="text-align:left;margin:0 0 10px">'+esc(s.profHint)+'</p>';
  PROFILOK.forEach(function(p){ var most=p.id===PROFIL;
    h+='<div class="prow'+(most?' on':'')+'">'+
      '<button type="button" class="pmain" data-profswitch="'+p.id+'">'+mascotHtml('pav')+
      '<span class="pnm">'+esc(p.name||s.profNoName)+'</span>'+(most?'<i>'+esc(s.profNow)+'</i>':'')+'</button>'+
      (PROFILOK.length>1?'<button type="button" class="pdel" data-profdel="'+p.id+'" aria-label="'+esc(s.profDelete)+'"><svg><use href="#i-trash"/></svg></button>':'')+
      '</div>'; });
  h+='<label class="lbl" for="profName" style="display:block;margin-top:14px">'+esc(s.profAskName)+'</label>'+
    '<input id="profName" class="field" type="text" autocomplete="off" placeholder="'+esc(s.namePlaceholder)+'">'+
    '<button type="button" class="primary" data-profnew>'+esc(s.profNew)+'</button>';
  return h; }
function profileHtml(){ var s=T(); return '<h4>'+esc(s.profile)+'</h4><label class="lbl" for="nameField">'+esc(s.yourName)+'</label><input id="nameField" class="field" type="text" autocomplete="nickname" placeholder="'+esc(s.namePlaceholder)+'" value="'+esc(S.name)+'"><button type="button" class="primary" data-savename>'+esc(s.save)+'</button>'; }

// ---------- events ----------
document.getElementById('app').addEventListener('click',function(e){
  // A lenyilo nevvalaszto bezarul, ha valahova mashova koppintanak.
  if(whoOpen&&!e.target.closest('.whowrap')){ whoOpen=false;
    setTimeout(function(){ var m=document.querySelector('.whomenu'); if(m) m.remove();
      var b=document.querySelector('.whobar.open'); if(b) b.classList.remove('open'); },0); }
  var el=e.target.closest('button,[data-tab],[data-color]'); if(!el) return;
  var d=el.dataset;
  if(d.tab){
    if(d.tab==='menu'){ openSheet(menuHtml()); if(!tourSeen('menu')) startTour('menu'); return; }
    tab=d.tab; render(); maybeTour(d.tab); return; }
  if(d.slot!=null){ var p=d.slot.split(','); var go=function(){ startSlot(+p[0],+p[1],+p[2]); }; if(viaWeek(go)) return; go(); return; }
  // A pontok beszedese utan jon a napi szeria kepernyoje, ha ez volt a nap elso feladata.
  if(el.hasAttribute('data-collect')){ clearTimeout(window.__weekT); if(viaWeek(goHome)) return; weekNext=null; goHome(); return; }
  if(el.hasAttribute('data-weeknext')){ clearTimeout(window.__weekT); var f=weekNext; weekNext=null; screen={name:'result',r:screen.r}; if(f) f(); else goHome(); return; }
  if(el.hasAttribute('data-placestart')){ startPlacement(); return; }
  if(el.hasAttribute('data-placeskip')){ skipPlacement(); return; }
  if(el.hasAttribute('data-placego')){ placement=null; goHome(); return; }
  if(d.place!=null){ answerPlacement(+d.place); return; }
  if(d.setdiff){ S.diff=d.setdiff; S.diffSet=partsDoneAll(); persist(); render(); return; }
  // A felmero vegen a javasolt szint helyett barmelyiket lehet valasztani.
  if(d.placelvl){ screen.lvl=d.placelvl; S.diff=d.placelvl; S.diffSet=0; S.placed=d.placelvl; persist(); render(); return; }
  if(d.mleft!=null){ pickMatchLeft(+d.mleft); return; }
  if(d.mright!=null){ pickMatchRight(+d.mright); return; }
  if(d.answer!=null){ answer(+d.answer); return; }
  if(el.hasAttribute('data-advance')){ advance(); return; }
  if(el.hasAttribute('data-tap')){ tapChest(); return; }
  if(el.hasAttribute('data-color')){ var r=el.getBoundingClientRect(); tapColor((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100); return; }
  if(el.hasAttribute('data-hint')){ useHint(); return; }
  if(el.hasAttribute('data-tournext')){ nextTourStep(); return; }
  if(el.hasAttribute('data-tourskip')){ endTour(); return; }
  if(el.hasAttribute('data-closesheet')){ closeSheet(); return; }
  if(el.hasAttribute('data-badgenext')){ closeSheet(); setTimeout(showNextBadge,260); return; }
  if(d.badge){ badgeSheet(d.badge); return; }
  if(d.again!=null){ var pa=d.again.split(','); closeSheet(); startSlot(+pa[0],+pa[1],+pa[2],true); return; }
  if(d.go!=null){ var pg=d.go.split(','); closePop(); scrim.classList.remove('show'); startSlot(+pg[0],+pg[1],+pg[2],true); return; }
  if(d.reread!=null){ var pr=d.reread.split(','); closeSheet(); lesson={ui:+pr[0],pi:+pr[1],slot:STORY_SLOT,reread:true}; screen={name:'story'}; render(); return; }
  if(d.heroinfo!=null){ p=d.heroinfo.split(','); heroSheet(+p[0],p[1]); return; }
  if(d.hero!=null){ p=d.hero.split(','); startHero(+p[0],p[1]); return; }
  if(d.herostart!=null){ p=d.herostart.split(','); startHero(+p[0],p[1]); return; }
  if(d.olivia!=null){ p=d.olivia.split(','); startOlivia(+p[0],+p[1]); return; }
  if(d.testbtn!=null){ p=d.testbtn.split(','); testSheet(+p[0],+p[1]); return; }
  if(d.test!=null){ p=d.test.split(','); closePop(); scrim.classList.remove('show'); startTest(+p[0],+p[1]); return; }
  if(d.pick!=null){ pickOrder(+d.pick); return; }
  if(el.hasAttribute('data-orderreset')){ resetOrder(); return; }
  if(el.hasAttribute('data-jump')){ jumpToCurrent(); return; }
  // A lap aljan ulo sav a kovetkezo modul elejere visz.
  if(el.hasAttribute('data-gomod')){ var mb=view.querySelector('#path .mbar[data-mi="'+el.dataset.mi+'"]');
    if(mb) view.scrollTop+=mb.getBoundingClientRect().top-view.getBoundingClientRect().top-36;
    syncStickyPart(); syncNextBar(); return; }
  // A hatralevo reszek kirajzolasa masodpercekig tarthat, ezert csak keresre nyilik ki,
  // es elotte kiirjuk, hogy dolgozik - kulonben ugy tunik, mintha nem tortent volna semmi.
  if(d.more!=null){ var mi=+d.more; el.textContent=T().loadingMore; el.disabled=true;
    keepScroll=view.scrollTop; setTimeout(function(){ mindResz[mi]=1; render(); },20); return; }
  if(d.mpick!=null){ modulValaszto(+d.mpick); return; }
  // Ugras a valasztott reszre: ha az osvenyen meg nincs kirajzolva, elobb kinyitjuk.
  if(d.goto){ var gkulcs=d.goto, gm=+gkulcs.split(',')[0]; closeSheet(); mindResz[gm]=1; tab='home'; screen={name:'home'};
    keepScroll=view.scrollTop; render();
    // A kirajzolas utan a kepek meg valtoztathatjak a magassagot, ezert ketszer igazitunk.
    ugrasReszre(gkulcs); setTimeout(function(){ ugrasReszre(gkulcs); },350); return; }
  if(el.hasAttribute('data-storydone')){ if(viaWeek(finishStory)) return; finishStory(); return; }
  if(el.hasAttribute('data-buyshield')){ buyShield(); return; }
  if(d.coltab){ colTab=d.coltab; render(); return; }
  if(el.hasAttribute('data-weekchest')){ if(viaWeek(openWeekChest)) return; openWeekChest(); return; }
  if(el.hasAttribute('data-home')){ if(viaWeek(goHome)) return; goHome(); return; }
  if(d.gotab){ tab=d.gotab; goHome(); return; }
  if(d.buy!=null){ buyCard(C.gifts[+d.buy]); return; }
  if(d.cal){ calOffset+=+d.cal; if(calOffset>0) calOffset=0; render(); return; }
  if(d.theme){ S.theme=d.theme; applyTheme(); persist(); render(); return; }
  if(el.hasAttribute('data-fix')){ fixSheet(); return; }
  if(el.hasAttribute('data-fixstart')){ startPractice(); return; }
  if(el.hasAttribute('data-fixclear')){ if(confirm(T().fixClearAsk)){ S.mistakes=[]; persist(); closeSheet(); render(); } return; }
  if(el.hasAttribute('data-report')){ reportSheet(); return; }
  // A sorra koppintas csak kivalaszt; a bejelentes a Kuldom gombbal megy el,
  // hogy kozben sajat szoveget is be lehessen irni.
  if(d.reportkind!=null){ reportPick=(reportPick===d.reportkind?null:d.reportkind);
    document.querySelectorAll('#sheet .rkind').forEach(function(b){ b.classList.toggle('sel', b.dataset.reportkind===reportPick); });
    return; }
  if(el.hasAttribute('data-reportsend')){ var ta=document.getElementById('rnote'), megj=ta?ta.value.trim():'';
    if(!reportPick&&!megj){ alert(T().reportPickFirst); return; }
    saveReport(reportPick||'other', megj); return; }
  if(el.hasAttribute('data-reports')){ reportsSheet(); return; }
  if(el.hasAttribute('data-repclear')){ if(confirm(T().fixClearAsk)){ S.reports=[]; persist(); closeSheet(); render(); } return; }
  if(el.hasAttribute('data-repcopy')){
    var txt=(S.reports||[]).map(function(x){ return '- ['+(T().reportKinds[x.k]||x.k)+'] '+x.q+(x.m?'  — '+x.m:'')+'  ('+x.hely+', '+x.mikor+')'; }).join(String.fromCharCode(10));
    try{ navigator.clipboard.writeText(txt); el.textContent=T().reportsCopied; }catch(x){ prompt(T().reportsCopy,txt); } return; }
  if(d.mapbg!=null){ S.mapBg=d.mapbg==='1'; persist(); render(); return; }
  if(d.lang){ S.lang=d.lang; persist(); render(); return; }
  if(el.hasAttribute('data-settings')){ closeSheet(); tab='settings'; render(); return; }
  if(el.hasAttribute('data-profilepage')){ closeSheet(); tab='profile'; render(); return; }
  if(el.hasAttribute('data-editname')){ editingName=!editingName; render(); if(editingName) setTimeout(function(){ var f=document.getElementById('nameField'); if(f) f.focus(); },60); return; }
  if(el.hasAttribute('data-profile')){ closeSheet(); tab='profile'; editingName=true; render(); setTimeout(function(){ var f=document.getElementById('nameField'); if(f) f.focus(); },60); return; }
  if(d.avatar){ S.avatar=d.avatar; persist(); render(); return; }
  if(el.hasAttribute('data-whotoggle')){ whoOpen=!whoOpen; keepScroll=view.scrollTop; render();
    if(whoOpen){ var wb=document.querySelector('.whowrap'); if(wb&&wb.scrollIntoView) try{ wb.scrollIntoView({block:'start'}); }catch(e){ wb.scrollIntoView(); } }
    return; }
  if(el.hasAttribute('data-profswitch')){ profilVált(el.dataset.profswitch); return; }
  if(el.hasAttribute('data-profnew')){ var mez=document.getElementById('profName'); ujProfil(((mez&&mez.value)||'').trim()); return; }
  if(el.hasAttribute('data-profdel')){ if(confirm(T().profDelAsk(profilNev(el.dataset.profdel)||T().profNoName))) profilTörlés(el.dataset.profdel); return; }
  if(el.hasAttribute('data-profsheet')){ whoOpen=false; openSheet(profilSheet()); return; }
  if(el.hasAttribute('data-savename')){ var mp=mostaniProfil(); if(mp){ mp.name=((document.getElementById('nameField')||{}).value||'').trim(); nyersIr('bq-profiles',PROFILOK); } var f=document.getElementById('nameField'); S.name=(f?f.value:'').trim(); editingName=false; persist(); render(); return; }
  if(el.hasAttribute('data-reset')){ if(confirm(T().resetConfirm)){ try{ var ks=[]; for(var ki=0;ki<localStorage.length;ki++){ var kk=localStorage.key(ki); if(kk&&kk.indexOf('bq-')===0) ks.push(kk); } ks.forEach(function(k){ localStorage.removeItem(k); }); }catch(x){} location.reload(); } return; }
});
scrim.addEventListener('click',closeSheet);
sheet.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.id==='nameField'){ S.name=e.target.value.trim(); persist(); render(); } });
addEventListener('resize',layoutPath);
addEventListener('resize',function(){ if(tour) drawTourStep(); });
view.addEventListener('scroll',function(){ if(screen.name==='home'&&tab==='home'){ syncStickyPart(); syncNextBar(); } },{passive:true});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutPath);

// heart countdown tick
setInterval(function(){
  if(!S.heartLosses.length) return;
  var before=S.heartLosses.length; pruneHearts();
  if(S.heartLosses.length!==before && screen.name==='home'){ render(); return; }
  var c=document.getElementById('heartChip'); if(c){ c.outerHTML=heartChip(); }
  // A feladatlap fejlecében is fusson a visszaszamlalo.
  var lh=document.getElementById('lessonHearts');
  if(lh&&lesson){ var tm=lh.querySelector('.tm');
    if(lesson.hearts<HEARTS){ if(tm) tm.textContent=mmss(msToNextHeart());
      else lh.insertAdjacentHTML('beforeend','<span class="tm">'+mmss(msToNextHeart())+'</span>'); }
    else if(tm) tm.remove(); }
  var w=document.getElementById('waitBox'); if(w){ if(hearts()>0) render(); else w.innerHTML=heartIco(true)+' '+esc(T().waitForHeart(mmss(msToNextHeart()))); }
},1000);

applyTheme();
flushReports();
seedBadges();
// A legelso inditaskor Olivia bemutatkozik, es felajanlja a rovid szintfelmerest.
if(S.placed==null&&!partsDoneAll()&&!S.xp) screen={name:'intro'};
render();
if(screen.name==='home'&&!popBadges()) maybeTour('home');
}
</script>
</body>
